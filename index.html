<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7e7e5"><meta name="description" content="Um pequeno livro de amor, feito para você."><title>Para você — um pequeno livro de amor</title>
<style>
:root{--paper:#fffaf5;--blush:#F1BFBF;--rose:#E27D7D;--coral:#E96363;--muted:#B75F5F;--wine:#993333;--ink:#392a2a;--soft:#f7e7e5;--shadow:0 22px 70px #562a2a22}
*{box-sizing:border-box}body{margin:0;min-height:100svh;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#fff9f6 0%,#f3e5e2 70%,#eedbd8 100%);font-family:Georgia,"Times New Roman",serif}button{font:inherit;color:inherit}.shell{max-width:1000px;margin:auto;padding:clamp(14px,3vw,30px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 16px;max-width:790px;font-family:system-ui,sans-serif;color:#805452;font-size:13px}.brand{letter-spacing:.09em;text-transform:uppercase;font-size:11px}.tools{display:flex;gap:8px}.quiet{border:1px solid #e8c8c3;background:#fff9f5d9;padding:9px 12px;border-radius:999px;cursor:pointer;font-size:12px}.quiet:hover,.nav:hover{border-color:var(--coral);color:var(--wine)}.book{margin:auto;max-width:790px;position:relative}.page{min-height:min(76svh,780px);height:min(76svh,780px);overflow:auto;position:relative;border:1px solid #eadbd4;border-radius:8px 19px 19px 8px;background:var(--paper);box-shadow:var(--shadow);padding:clamp(32px,7vw,78px) clamp(27px,9vw,100px) 50px;touch-action:pan-y;display:flex;flex-direction:column;animation:appear .3s ease}@keyframes appear{from{opacity:.55;transform:translateX(8px)}to{opacity:1;transform:none}}.page:before{content:"";position:absolute;top:0;bottom:0;left:14px;border-left:1px solid #f0e4df}.page.cover{background:linear-gradient(150deg,#fffaf6,#f8e2df 62%,#f1bfbf);text-align:center;align-items:center;justify-content:center}.eyebrow{color:var(--muted);font:600 11px/1.4 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}.cover h1{font-size:clamp(40px,8vw,74px);line-height:.98;font-weight:400;color:var(--wine);margin:22px 0 16px;max-width:540px}.cover .subtitle{font-style:italic;color:#805452;font-size:clamp(17px,3vw,23px);margin:0}.cover .ornament{color:var(--coral);font-size:28px;margin-top:40px}.dedication{color:var(--muted);font-style:italic}.page h2{font-weight:400;color:var(--wine);font-size:clamp(28px,5vw,42px);line-height:1.1;margin:10px 0 25px}.body{font-size:clamp(18px,2.6vw,22px);line-height:1.8;white-space:pre-wrap;outline:none;min-height:2em}.body:focus,.title-edit:focus{outline:2px solid #e27d7d55;outline-offset:6px;border-radius:4px}.title-edit{outline:none}.photo-wrap{position:relative;margin:22px auto 0;width:100%;max-width:470px;min-height:30px}.photo-wrap img{display:block;width:100%;max-height:310px;object-fit:contain;border-radius:7px;background:#f8eeea}.photo-actions{display:flex;gap:8px;justify-content:center;margin-top:8px}.photo-empty{border:1px dashed #d9a7a3;border-radius:8px;padding:15px;text-align:center;color:#895f5b;font:13px system-ui,sans-serif}.photo-empty button{margin-left:7px;border:0;background:transparent;text-decoration:underline;color:var(--wine);cursor:pointer}.closing{margin-top:auto;padding-top:36px;color:var(--muted);font-style:italic;font-size:18px}.page-no{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#a9918a;font:11px system-ui,sans-serif}.controls{max-width:790px;margin:16px auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font-family:system-ui,sans-serif}.nav{width:42px;height:42px;border-radius:50%;border:1px solid #e8c8c3;background:#fff9f5;cursor:pointer;font-size:18px}.nav:last-child{justify-self:end}.progress{height:3px;width:min(34vw,220px);background:#e8d8d3;border-radius:3px;overflow:hidden}.progress span{display:block;height:100%;background:var(--coral);transition:width .25s}.count{font-size:12px;color:#805452;text-align:center;margin-top:8px}.hint{text-align:center;color:#987d77;font:11px system-ui,sans-serif;margin:9px 0}.edit-note{max-width:790px;margin:16px auto 0;padding:11px 14px;border-radius:10px;background:#fff7f2;color:#76534e;font:12px/1.5 system-ui,sans-serif}.edit-note[hidden]{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#392a2a;color:white;padding:10px 15px;border-radius:20px;font:13px system-ui,sans-serif;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}input[type=file]{display:none}
@media(max-width:600px){.shell{padding:12px 10px 20px}.top{margin-bottom:11px}.page{height:calc(100svh - 155px);min-height:490px;padding:42px 29px 48px;border-radius:7px 14px 14px 7px}.page:before{left:10px}.body{line-height:1.72}.quiet{padding:8px 10px}.controls{margin-top:11px}.hint{margin-top:7px}.photo-wrap img{max-height:220px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="shell"><header class="top"><div class="brand">um livro pequeno, um sentimento imenso</div><div class="tools"><button class="quiet" id="editBtn" aria-pressed="false">Editar livro</button><button class="quiet" id="resetBtn" title="Voltar ao texto original">Restaurar</button></div></header>
<main class="book" aria-label="Leitor de livro digital"><section id="page" class="page" aria-live="polite"></section></main>
<nav class="controls" aria-label="Navegação entre páginas"><button class="nav" id="prev" aria-label="Página anterior">‹</button><div><div class="progress" role="progressbar" aria-label="Progresso da leitura" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1"><span id="bar"></span></div><div class="count" id="count"></div></div><button class="nav" id="next" aria-label="Próxima página">›</button></nav><div class="hint">Deslize para a esquerda ou direita para virar a página</div><div class="edit-note" id="editNote" hidden>Modo de edição: toque nos títulos e textos para alterar. Use “Adicionar foto” para escolher uma imagem do aparelho. As mudanças ficam salvas neste navegador.</div></div><div class="toast" id="toast" role="status"></div><input id="photoInput" type="file" accept="image/*">
<script>
(function(){
const original=[
{kind:"cover",eyebrow:"Uma demonstração do meu amor",title:"Para meus papais"},
{kind:"dedication",eyebrow:"dedicatória",title:"A vocês",body:"Este pequeno livro é para vocês, que sempre viveram (as vezes o mais difícil) para que nossa vida fosse mais fácil.\n\nVocês que viveram em funcão do nosso bem estar, vocês que se dedicaram e entregaram tudo por nós."},
{eyebrow:"primeira parte · os professores",title:"Ser professor hoje é um ato de resistência",ending:"Como diria José Bezerra: \n'Ser professor é fazer no \n presente \n O futuro de muitas vidas'\n\n\nvocês mudam e transformam vidas com escelência!\n\nhonro a vida de vocês"},
{eyebrow:"as pequenas coisas",title:"O que admiro em vocês",body:"Eu amo muito em vocês — inclusive as coisas que talvez você nem percebam.\n\nA maneira como nossa relação é segura e mesmo que erremos - como sempre - vocês continuam nos apoiando e nos amando tanto.\nOs olhares e pequenas atitudes as vezes quase que despercebidas que relembram em uma segunda feira difíci que ainda somos amadas."},
{eyebrow:"as pequenas coisas 2.0",title:"Meu abrigo",body:"",image:"images/meu-abrigo.png",ending:"[Nossa saída para comer após semanas intensas de vestibular, vocês foram minha calmaria.]"},
{eyebrow:"foto",title:"Uma lembrança de alguns anos atrás",body:"",image:"images/foto-antiga.png",ending:""},
{eyebrow:"para terminar · e para continuar",title:"Ainda tenho tanto para dizer",body:"Que este pequeno livro seja uma pequena e mínima maneira de começar a agradecer por serem a presença e o caminho que me permitiu chegar até aqui. Amo vocês mais do que podem imaginar e mais do que sei expressar!",ending:"Com amor, Laurinha"}
];
const KEY="mini-livro-amor-v2";let data,idx=0,editing=false,pendingPhoto=null,touchX=null;const $=s=>document.querySelector(s),page=$("#page"),input=$("#photoInput");
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));data=Array.isArray(s)&&s.length===original.length?s:JSON.parse(JSON.stringify(original))}catch(e){data=JSON.parse(JSON.stringify(original))}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast("Não foi possível salvar. Tente uma imagem menor.");return false}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ed(f){return editing?'contenteditable="true" spellcheck="true" data-field="'+f+'"':""}
function render(){const p=data[idx];page.className="page"+(p.kind==="cover"?" cover":"");let h="";
if(p.kind==="cover")h='<div class="eyebrow title-edit" '+ed("eyebrow")+'>'+esc(p.eyebrow)+'</div><h1 class="title-edit" '+ed("title")+'>'+esc(p.title)+'</h1><p class="subtitle title-edit" '+ed("subtitle")+'>'+esc(p.subtitle)+'</p><div class="ornament" aria-hidden="true">♡</div>';
else{h='<div class="eyebrow title-edit" '+ed("eyebrow")+'>'+esc(p.eyebrow)+'</div><h2 class="title-edit" '+ed("title")+'>'+esc(p.title)+'</h2><div class="'+(p.kind==="dedication"?"body dedication":"body")+'" '+ed("body")+'>'+esc(p.body).replace(/\n/g,"<br>")+'</div>';
if(p.image)h+='<div class="photo-wrap"><img src="'+p.image+'" alt="Foto adicionada a esta página">'+(editing?'<div class="photo-actions"><button class="quiet" data-action="replace">Substituir</button><button class="quiet" data-action="remove">Remover</button></div>':'')+'</div>';
else if(editing)h+='<div class="photo-wrap"><div class="photo-empty"><button data-action="add">Adicionar foto a esta página</button></div></div>';
if(p.ending)h+='<div class="closing title-edit" '+ed("ending")+'>'+esc(p.ending).replace(/\n/g,"<br>")+'</div>';
if(idx===5&&!p.image&&!editing)h+='<div class="photo-wrap"><div class="photo-empty">Adicione uma foto ao ativar “Editar livro”.</div></div>'}
h+='<div class="page-no">'+String(idx+1).padStart(2,"0")+'</div>';page.innerHTML=h;
page.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("input",()=>{data[idx][el.dataset.field]=el.innerText;persist()}));
page.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.action==="remove"){data[idx].image=null;persist();render();toast("Foto removida")}else{pendingPhoto=idx;input.click()}}));
$("#count").textContent="Página "+(idx+1)+" de "+data.length;$("#bar").style.width=((idx+1)/data.length*100)+"%";$(".progress").setAttribute("aria-valuenow",idx+1);$("#prev").disabled=idx===0;$("#next").disabled=idx===data.length-1;$("#prev").style.opacity=idx===0?".4":"1";$("#next").style.opacity=idx===data.length-1?".4":"1"}
function go(n){idx=Math.max(0,Math.min(data.length-1,n));render()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900)}
$("#prev").onclick=()=>go(idx-1);$("#next").onclick=()=>go(idx+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&!e.target.isContentEditable)go(idx-1);if(e.key==="ArrowRight"&&!e.target.isContentEditable)go(idx+1)});
page.addEventListener("touchstart",e=>{touchX=e.changedTouches[0].clientX},{passive:true});page.addEventListener("touchend",e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)go(idx+(dx<0?1:-1));touchX=null},{passive:true});
$("#editBtn").onclick=()=>{editing=!editing;$("#editBtn").textContent=editing?"Concluir edição":"Editar livro";$("#editBtn").setAttribute("aria-pressed",editing);$("#editNote").hidden=!editing;render()};
$("#resetBtn").onclick=()=>{if(confirm("Restaurar os textos originais e remover as fotos adicionadas?")){data=JSON.parse(JSON.stringify(original));idx=0;persist();render();toast("Livro restaurado")}};
input.onchange=()=>{const f=input.files&&input.files[0];if(!f||pendingPhoto===null)return;if(!f.type.startsWith("image/")){toast("Escolha um arquivo de imagem");return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1500,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);data[pendingPhoto].image=c.toDataURL("image/jpeg",.84);if(persist()){render();toast("Foto salva neste navegador")}pendingPhoto=null};im.src=r.result};r.readAsDataURL(f);input.value=""};
load();render();
})();
</script></body></html>
